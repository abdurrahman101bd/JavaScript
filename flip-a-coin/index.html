<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip a Coin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="container">
    <h1 class="title">Flip a Coin</h1>
    <p class="subtitle">Heads or tails — let's decide</p>

    <div class="stats">
      <div class="stat-card heads-stat">
        <span class="stat-label">Heads</span>
        <span class="stat-value" id="heads-count">0</span>
      </div>
      <div class="stat-card tails-stat">
        <span class="stat-label">Tails</span>
        <span class="stat-value" id="tails-count">0</span>
      </div>
    </div>

    <div class="coin-wrapper">
      <div class="coin" id="coin">
        <div class="face heads">
          <img src="heads.svg" alt="Heads" />
        </div>
        <div class="face tails">
          <img src="tails.svg" alt="Tails" />
        </div>
        <div class="coin-glow"></div>
      </div>
    </div>

    <div class="buttons">
      <button id="flip-button" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-.5-13v4H8l4 4 4-4h-3.5V7z"/>
        </svg>
        Flip Coin
      </button>
      <button id="reset-button" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        Reset
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
