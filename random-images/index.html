<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Images Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <main class="container">
    <h1 class="title">Random Images</h1>
    <p class="subtitle">Fresh set of images every click</p>

    <div class="count-selector">
      <span class="count-label">Count</span>
      <div class="count-btns">
        <button class="count-btn active" data-count="3">3</button>
        <button class="count-btn" data-count="1">1</button>
        <button class="count-btn" data-count="5">5</button>
        <button class="count-btn" data-count="9">9</button>
      </div>
    </div>

    <div class="images" id="images">
      <!-- Images injected by JS -->
    </div>

    <button id="generate-btn" class="btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
      Generate Images
    </button>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-overlay" id="lightboxOverlay"></div>
  
    <div class="lightbox-content" id="lightboxContent">
      <img id="lightboxImg" src="" alt="Preview" />
  
      <div class="lightbox-actions">
        <button class="lightbox-btn" id="lightboxDownload" title="Download">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
