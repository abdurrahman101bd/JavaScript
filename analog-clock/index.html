<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <main class="app">
    <h1 class="title">Analog Clock</h1>
    <p class="subtitle">Real-time · Smooth sweep</p>

    <div class="clock-wrap">
      <div class="clock">
        <svg class="clock-face" viewBox="0 0 200 200" aria-hidden="true">
          <g class="ticks-hour">
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(0 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(30 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(60 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(90 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(120 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(150 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(180 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(210 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(240 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(270 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(300 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="22" transform="rotate(330 100 100)"/>
          </g>

          <g class="ticks-minute">
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(6 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(12 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(18 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(24 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(36 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(42 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(48 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(54 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(66 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(72 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(78 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(84 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(96 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(102 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(108 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(114 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(126 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(132 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(138 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(144 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(156 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(162 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(168 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(174 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(186 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(192 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(198 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(204 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(216 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(222 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(228 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(234 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(246 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(252 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(258 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(264 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(276 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(282 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(288 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(294 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(306 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(312 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(318 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(324 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(336 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(342 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(348 100 100)"/>
            <line x1="100" y1="12" x2="100" y2="17" transform="rotate(354 100 100)"/>
          </g>

          <g class="numbers">
            <text x="100" y="40">12</text>
            <text x="130" y="46">1</text>
            <text x="155" y="63">2</text>
            <text x="166" y="90">3</text>
            <text x="160" y="122">4</text>
            <text x="145" y="148">5</text>
            <text x="100" y="172">6</text>
            <text x="55" y="148">7</text>
            <text x="40" y="122">8</text>
            <text x="34" y="90">9</text>
            <text x="45" y="63">10</text>
            <text x="70" y="46">11</text>
          </g>
        </svg>

        <div class="hand hand-hour" id="hand-hour"></div>
        <div class="hand hand-minute" id="hand-minute"></div>
        <div class="hand hand-second" id="hand-second"></div>
        <div class="center-cap"></div>
        <div class="center-cap-glow"></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
