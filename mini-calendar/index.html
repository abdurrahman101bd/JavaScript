<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/digital-7-mono" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <title>Mini Calendar</title>
  </head>
  <body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="calendar-container">
      <p class="month-name" id="month-name">October</p>

      <div class="calendar-body">
        <p class="day-name" id="day-name">Sunday</p>
        <p class="day-number" id="day-number">04</p>
        <div class="divider"></div>
        <p class="year" id="year">2026</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
