<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wiki Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <main class="app">
    <section class="hero">
      <div class="wiki-logo-wrap">
        <img src="wiki.png" alt="Wikipedia" class="wiki-logo" />
      </div>
      <h1>Wiki Search</h1>
      <p class="subtitle">Search anything on Wikipedia</p>

      <form class="search-form" id="search-form">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="search" placeholder="Search Wikipedia..." autocomplete="off" spellcheck="false" />
        </div>
        <button type="submit" class="search-btn">
          <span class="btn-label">Search</span>
          <span class="spinner" hidden></span>
        </button>
      </form>
    </section>

    <!-- Results -->
    <section class="results-section">
      <div class="results-head" id="results-head" hidden>
        <span class="results-label" id="results-label">Results</span>
        <span class="results-count" id="results-count">0</span>
      </div>

      <div class="results" id="results">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <p class="empty-title">Search Wikipedia</p>
          <p class="empty-desc">Enter any topic to explore results</p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
