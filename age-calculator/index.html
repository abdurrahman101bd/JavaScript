<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <header class="nav-wrap">
    <nav class="navbar">
      <a href="#" class="logo"><span>JS</span></a>
      <h1>Age Calculator</h1>
      <button id="theme-switch" type="button" aria-label="Toggle theme">
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M11.3807 2.01886C9.91573 3.38768 9 5.3369 9 7.49999C9 11.6421 12.3579 15 16.5 15C18.6631 15 20.6123 14.0843 21.9811 12.6193C21.6613 17.8537 17.3149 22 12 22C6.47715 22 2 17.5228 2 12C2 6.68514 6.14629 2.33869 11.3807 2.01886Z"/></svg>
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"/></svg>
      </button>
    </nav>
  </header>

  <main class="container">
    <!-- Left Side: Input -->
    <div class="panel panel-input">
      <div class="panel-head">
        <h2>Your Birthday</h2>
      </div>
      
      <div class="input-group">
        <label>Date of Birth</label>
        <div class="date-selectors">
          <div class="select-wrapper">
            <select id="dob-day"></select>
            <span class="select-label">Day</span>
          </div>
          <div class="select-wrapper">
            <select id="dob-month"></select>
            <span class="select-label">Month</span>
          </div>
          <div class="select-wrapper">
            <select id="dob-year"></select>
            <span class="select-label">Year</span>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label>Age at the Date of</label>
        <div class="date-selectors">
          <div class="select-wrapper">
            <select id="at-day"></select>
            <span class="select-label">Day</span>
          </div>
          <div class="select-wrapper">
            <select id="at-month"></select>
            <span class="select-label">Month</span>
          </div>
          <div class="select-wrapper">
            <select id="at-year"></select>
            <span class="select-label">Year</span>
          </div>
        </div>
      </div>

      <button id="calculate-btn" class="calculate-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg>
        Calculate Age
      </button>
    </div>

    <!-- Right Side: Result -->
    <div class="panel panel-result">
      <div class="result-header">
        <h2>Your Age</h2>
        <span class="badge" id="result-date-badge"></span>
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <p>Enter your date of birth to see your age</p>
      </div>

      <!-- Result Content -->
      <div class="result-content" id="result-content" hidden>
        
        <!-- Main Age (Years, Months, Days) -->
        <div class="age-display">
          <div class="age-block">
            <span class="age-value" id="years">0</span>
            <span class="age-label">Years</span>
          </div>
          <div class="age-block">
            <span class="age-value" id="months">0</span>
            <span class="age-label">Months</span>
          </div>
          <div class="age-block">
            <span class="age-value" id="days">0</span>
            <span class="age-label">Days</span>
          </div>
        </div>

        <!-- Detailed List -->
        <div class="detailed-list">
          <div class="list-item">
            <span class="list-label">Or</span>
            <span class="list-value"><strong id="total-months">0</strong> months <span id="extra-days-1">0</span> days</span>
          </div>
          <div class="list-item">
            <span class="list-label">Or</span>
            <span class="list-value"><strong id="total-weeks">0</strong> weeks <span id="extra-days-2">0</span> days</span>
          </div>
          <div class="list-item">
            <span class="list-label">Or</span>
            <span class="list-value"><strong id="total-days">0</strong> days</span>
          </div>
          <div class="list-item">
            <span class="list-label">Or</span>
            <span class="list-value"><strong id="total-hours">0</strong> hours</span>
          </div>
          <div class="list-item">
            <span class="list-label">Or</span>
            <span class="list-value"><strong id="total-minutes">0</strong> minutes</span>
          </div>
          <div class="list-item">
            <span class="list-label">Or</span>
            <span class="list-value"><strong id="total-seconds">0</strong> seconds</span>
          </div>
        </div>

        <!-- Birthday Info (Day of Week, Day of Year) -->
        <div class="birthday-info">
          <div class="info-box">
            <span class="info-label">Born on a</span>
            <span class="info-value" id="day-of-week">-</span>
          </div>
          <div class="info-box">
            <span class="info-label">Day of Year</span>
            <span class="info-value" id="day-of-year">-</span>
          </div>
          <div class="info-box">
            <span class="info-label">Week of Year</span>
            <span class="info-value" id="week-of-year">-</span>
          </div>
        </div>

        <!-- Next Birthday -->
        <div class="next-birthday" id="next-birthday-wrap">
          <div class="next-bd-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"></path><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"></path><path d="M2 21h20"></path><path d="M7 8v3"></path><path d="M12 8v3"></path><path d="M17 8v3"></path><path d="M7 4h.01"></path><path d="M12 4h.01"></path><path d="M17 4h.01"></path></svg>
          </div>
          <div class="next-bd-text">
            <p class="next-bd-title">Next Birthday</p>
            <p class="next-bd-desc" id="next-birthday-text">In 0 days</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
