<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <main class="container">
    <header class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Password Generator</h1>
      <p class="subtitle">Secure · Random · Yours</p>
    </header>

    <div class="password-container">
      <input type="text" readonly id="password" placeholder="Generating..." />
      <button id="copy-btn" class="copy-btn" aria-label="Copy password">
        <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
    </div>

    <div class="strength-container">
      <div class="strength-head">
        <span>Password Strength</span>
        <span id="strength-label" class="strength-label">—</span>
      </div>
      <div class="strength-meter">
        <div class="strength-bar" id="strength-bar"></div>
      </div>
    </div>

    <div class="options">
      <div class="option option-range">
        <div class="option-head">
          <label for="length">Password Length</label>
          <span id="length-value" class="length-value">12</span>
        </div>
        <input type="range" id="length" min="6" max="32" value="12" />
      </div>

      <div class="option">
        <label for="uppercase">Include Uppercase</label>
        <label class="switch">
          <input type="checkbox" id="uppercase" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="option">
        <label for="lowercase">Include Lowercase</label>
        <label class="switch">
          <input type="checkbox" id="lowercase" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="option">
        <label for="numbers">Include Numbers</label>
        <label class="switch">
          <input type="checkbox" id="numbers" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="option">
        <label for="symbols">Include Symbols</label>
        <label class="switch">
          <input type="checkbox" id="symbols" checked />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <button id="generate-btn" class="generate-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
      </svg>
      Generate Password
    </button>
  </main>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
