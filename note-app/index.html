<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"/>
  <link rel="stylesheet" href="style.css" />
  <title>Notes App</title>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-top">
        <div>
          <h1>Notes App</h1>
          <p>Store your thoughts and ideas in style</p>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="header-icon-btn" title="Toggle theme" aria-label="Toggle theme">
            <i class="fas fa-moon"></i>
          </button>
          <button id="exportBtn" class="header-icon-btn" title="Export notes" aria-label="Export notes" >
            <i class="fas fa-download"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="controls-container">
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="Search notes... (Ctrl+K)" class="search-input" />
          <button id="clearSearchBtn" class="clear-search-btn" aria-label="Clear search" title="Clear search" >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="filter-group">
          <select id="filterSelect" class="filter-select">
            <option value="all">All notes</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="ideas">Ideas</option>
            <option value="reminders">Reminders</option>
          </select>
          <button id="clearAllBtn" class="ghost-btn" title="Delete all notes" >
            <i class="fas fa-trash-can"></i>
            <span class="ghost-btn-label">Clear all</span>
          </button>
        </div>
      </div>
    </div>

    <div id="notesContainer" class="notes-grid"></div>

    <div id="emptyState" class="empty-state">
      <i class="fas fa-feather-pointed"></i>
      <h3>No notes yet</h3>
      <p>Start capturing your thoughts — click below to add your first note</p>
    </div>

    <div id="addNoteModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title" id="modalTitle">New Note</h3>
          <button id="closeModalBtn" class="modal-close" aria-label="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <form id="noteForm" class="modal-body">
          <div class="form-group">
            <div class="form-label-row">
              <label for="noteTitle" class="form-label">Title</label>
              <span class="char-count"><span id="titleCount">0</span>/60</span>
            </div>
            <input type="text" id="noteTitle" class="form-input" maxlength="60" placeholder="Give your note a title..." required />
          </div>

          <div class="form-group">
            <div class="form-label-row">
              <label for="noteContent" class="form-label">Content</label>
              <span class="char-count"><span id="contentCount">0</span>/1000</span>
            </div>
            <textarea id="noteContent" class="form-input form-textarea" maxlength="1000" placeholder="Write your thoughts..." required ></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Tag</label>
            <div class="tags-container">
              <label class="tag-option">
                <input type="radio" name="noteTag" value="work" class="tag-radio" />
                <span class="tag-label tag-work"><i class="fas fa-briefcase"></i> Work</span>
              </label>
              <label class="tag-option">
                <input type="radio" name="noteTag" value="personal" class="tag-radio" />
                <span class="tag-label tag-personal"><i class="fas fa-user"></i> Personal</span>
              </label>
              <label class="tag-option">
                <input type="radio" name="noteTag" value="ideas" class="tag-radio" checked />
                <span class="tag-label tag-ideas"><i class="fas fa-lightbulb"></i> Ideas</span>
              </label>
              <label class="tag-option">
                <input type="radio" name="noteTag" value="reminders" class="tag-radio" />
                <span class="tag-label tag-reminders"><i class="fas fa-bell"></i> Reminder</span>
              </label>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <i class="fas fa-check"></i>
            <span id="submitBtnLabel">Save Note</span>
          </button>
        </form>
      </div>
    </div>

    <div id="detailModal" class="modal-overlay">
      <div class="modal detail-modal">
        <div class="detail-header">
          <div class="detail-actions">
            <button id="detailPinBtn" class="icon-btn" title="Pin / Unpin"><i class="fas fa-thumbtack"></i></button>
            <button id="detailEditBtn" class="icon-btn" title="Edit"><i class="fas fa-pen"></i></button>
            <button id="detailCopyBtn" class="icon-btn" title="Copy"><i class="fas fa-copy"></i></button>
            <button id="detailDeleteBtn" class="icon-btn delete-btn" title="Delete"><i class="fas fa-trash"></i></button>
          </div>
          <button id="closeDetailBtn" class="modal-close" aria-label="Close"><i class="fas fa-times"></i></button>
        </div>
        <div class="detail-body">
          <div class="detail-tag" id="detailTag"></div>
          <h2 class="detail-title" id="detailTitle"></h2>
          <p class="detail-content" id="detailContent"></p>
          <div class="detail-date" id="detailDate"></div>
        </div>
      </div>
    </div>

    <div id="confirmModal" class="modal-overlay">
      <div class="modal confirmation-modal">
        <div class="modal-body">
          <div class="confirm-icon">
            <i class="fas fa-triangle-exclamation"></i>
          </div>
          <p class="confirmation-text" id="confirmText">Are you sure you want to delete this note?</p>
          <div class="confirmation-buttons">
            <button id="cancelDeleteBtn" class="confirmation-btn cancel-btn">Cancel</button>
            <button id="confirmDeleteBtn" class="confirmation-btn confirm-btn">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button id="fabAddBtn" class="fab" title="Add new note (Ctrl+N)" aria-label="Add new note" ><i class="fas fa-plus"></i></button>
  <button id="scrollTopBtn" class="scroll-top" title="Back to top" aria-label="Back to top" ><i class="fas fa-arrow-up"></i></button>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
