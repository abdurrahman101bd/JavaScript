<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lorem Ipsum Generator</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Isometra&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/digital-7-mono" />
</head>
<body>
    <header class="nav-wrap">
        <nav class="navbar">
          <a href="#" class="logo"><span>JS</span></a>
          <h1>Lorem Ipsum Generator</h1>
          <button id="theme-switch" type="button" aria-label="Toggle theme">
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24"><path d="M11.3807 2.01886C9.91573 3.38768 9 5.3369 9 7.49999C9 11.6421 12.3579 15 16.5 15C18.6631 15 20.6123 14.0843 21.9811 12.6193C21.6613 17.8537 17.3149 22 12 22C6.47715 22 2 17.5228 2 12C2 6.68514 6.14629 2.33869 11.3807 2.01886Z"></path></svg>
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24"><path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"></path></svg>
          </button>
        </nav>
    </header>
    <main>
        <div class="options">
            <div class="paragraphs">
                <label for="paragraphs">Paragraphs:</label>
                <input type="range" id="paragraphs" min="1" max="50" value="1">
                <span id="paragraphsValue">1</span>
            </div>
            <div class="words">
                <label for="words">Words per Paragraph:</label>
                <input type="range" id="words" min="1" max="100" value="10">
                <span id="wordsValue">10</span>
            </div>
            <div>
                <div class="tags">
                    <label for="tags">Tag:</label>
                    <select id="tags"></select>
                </div>
                <div class="include">
                    <label for="include">Include HTML:</label>
                    <select id="include">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>
            <button id="generate">Generate Lorem Ipsum</button>
        </div>

        <div class="output-wrapper">
            <div class="output-toolbar">
                <span class="label">Output</span>
                <div class="btn-group">
                    <button id="copyBtn" class="tool-btn" type="button" aria-label="Copy output">
                        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                    </button>
                    <button id="clearBtn" class="tool-btn" type="button" aria-label="Clear output">
                        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        Clear
                    </button>
                </div>
            </div>
            <div class="output" id="outputBox"></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
