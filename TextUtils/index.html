<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" />
    <link rel="stylesheet" type="text/css" href="style.css"> 
    <title>Text Utils</title>
</head>
<body>
    <div class="container-wrapper">
        <header class="app-header">
            <h1>TextUtils</h1>
            <p class="app-subtitle">Transform, format, and refine your text instantly</p>
        </header>

        <div class="container">
            <div class="editor-header">
                <h2>Enter Your Text</h2>
                <span class="char-count" id="char-count">0 characters</span>
            </div>

            <textarea id="input-text" placeholder="Type or paste your text here..."></textarea>

            <div class="button-wrapper">
                <button type="button" id="btn-copy">
                    <span class="btn-icon material-symbols-outlined">content_copy</span> Copy
                </button>
                <button type="button" id="btn-clear">
                    <span class="btn-icon material-symbols-outlined">delete</span> Clear
                </button>
            </div>

            <div class="divider">
                <span>Transform</span>
            </div>

            <div class="options-wrapper">
                <button type="button" id="btn-uppercase">
                    <span class="option-icon">A</span>
                    <span class="option-label">UPPERCASE</span>
                </button>
                <button type="button" id="btn-lowercase">
                    <span class="option-icon">a</span>
                    <span class="option-label">lowercase</span>
                </button>
                <button type="button" id="btn-capitalize">
                    <span class="option-icon">Aa</span>
                    <span class="option-label">Capitalize</span>
                </button>
                <button type="button" id="btn-remove-spaces">
                    <span class="option-icon">␣</span>
                    <span class="option-label">Remove Spaces</span>
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="clear-modal">
        <div class="modal">
            <div class="modal-icon">⚠️</div>
            <h2>Are you sure?</h2>
            <p>Do you really want to clear all text? This action cannot be undone.</p>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="btn-modal-cancel">Cancel</button>
                <button type="button" class="btn-confirm" id="btn-modal-confirm">Yes, Clear</button>
            </div>
        </div>
    </div>

    <script src='script.js'></script>
</body>
</html>
